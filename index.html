<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alpha Education Network</title>
    <link rel="stylesheet" href="Styles.css">
</head>
<style>
    /* GLOBAL */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

a {
    text-decoration: none;
    color: inherit;
}

/* =========================
   NETWORK PAGE
========================= */

.network-body {
    background: #f4f4f4;
    text-align: center;
}

.network-header {
    padding: 40px;
}

.network-header h1 {
    font-size: 26px;
    letter-spacing: 2px;
}

.network-container {
    display: flex;
    justify-content: center;
    gap: 30px;
    padding: 40px;
}

.school-card {
    width: 220px;
    height: 260px;
    background: white;
    position: relative;
    border-bottom: 6px solid;
}

.school-logo {
    margin-top: 80px;
    font-weight: bold;
}

.school-card.blue { border-color: #1e3a8a; }
.school-card.yellow { border-color: #facc15; }
.school-card.dark { border-color: #111827; }
.school-card.orange { border-color: #f97316; }

.network-footer {
    padding: 20px;
    font-size: 12px;
}

/* =========================
   HOME PAGE
========================= */

.top-bar {
    background: #333;
    color: white;
    text-align: right;
    padding: 8px 20px;
    font-size: 12px;
}

.top-bar span {
    margin-left: 15px;
}

/* NAVBAR */
.navbar {
    display: flex;
    align-items: center;
    background: black;
    color: white;
    padding: 10px 20px;
}

.logo {
    display: flex;
    align-items: center;
}

.logo img {
    width: 50px;
    margin-right: 10px;
}

.nav-links {
    display: flex;
    list-style: none;
    margin-left: auto;
}

.nav-links li {
    margin: 0 10px;
    font-size: 13px;
    cursor: pointer;
}

.nav-links .active {
    color: orange;
}

/* HERO */
.hero {
    height: 80vh;
    background: url('classroom.jpg') center/cover no-repeat;
    position: relative;
}

.hero-overlay {
    position: absolute;
    top: 40%;
    left: 10%;
    color: white;
}

.hero-overlay h1 {
    font-size: 42px;
    line-height: 1.2;
}

.hero-bottom {
    position: absolute;
    bottom: 0;
    width: 100%;
    background: orange;
    display: flex;
    align-items: center;
    padding: 10px 20px;
}

.update {
    font-weight: bold;
}

.arrows {
    margin-left: 20px;
}

.apply-btn {
    margin-left: auto;
    background: #ff8c1a;
    border: none;
    padding: 10px 20px;
    color: white;
    cursor: pointer;
}


</style>
<body class="network-body">

<header class="network-header">
    <img src="logi.png" class="main-logo" alt="Alpha">
    <h1>MoosaTheGreat</h1>
</header>

<section class="network-container">

    <a href="Home.html" class="school-card blue">
        <div class="school-logo">alpha</div>
    </a>

    <a href="Home.html" class="school-card yellow">
        <div class="school-logo">alpha</div>
    </a>

    <a href="Home.html" class="school-card dark">
        <div class="school-logo">alpha</div>
        <p>GIRLS SCHOOL</p>
    </a>

    <a href="Home.html" class="school-card orange">
        <div class="school-logo">alpha</div>
    </a>



<footer class="network-footer">
    <p>Copyright © Alpha Education Network</p>
</footer>

</body>
</html>
